spring.application.name=OperationsHub-Test

# H2 In-Memory Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically create and drop tables for all JPA entities in H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Flyway in tests to let Hibernate manage the test schema directly
spring.flyway.enabled=false

# JWT settings
jwt.secret=94a08da1fecbb6e8b46990538c7b50b2b814a7061d4b68ce80635e985b85a3c94a08da1fecbb6e8b46990538c7b50b2b814a7061d4b68ce80635e985b85a3c
jwt.expiration-ms=900000
jwt.refresh-expiration-days=7
