spring.application.name=OperationsHub

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/operations_hub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# If using Spring Security, ensure /h2-console frame options are allowed

# JWT settings
jwt.secret=94a08da1fecbb6e8b46990538c7b50b2b814a7061d4b68ce80635e985b85a3c94a08da1fecbb6e8b46990538c7b50b2b814a7061d4b68ce80635e985b85a3c
jwt.expiration-ms=900000
jwt.refresh-expiration-days=7

# RabbitMQ Retry configuration for simple listener container
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=5000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cache Metrics
management.endpoint.metrics.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.metrics.cache.instrument=true
